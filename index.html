<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis recetas</title>
<meta name="theme-color" content="#f1efea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=EB+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efea;--card:#fbfbfa;--soft:#ebeae7;--ink:#1c1c1b;--muted:#9a9995;--line:#e5e4e0;--acc:#1c1c1b;--or:#d9573a;--serif:"EB Garamond",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);overflow-x:hidden}
body{margin:0;color:var(--ink);font:16px/1.5 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:8px 12px;border-radius:14px}
button:active{opacity:.6}
input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.muted{color:var(--muted)}.small{font-size:13.5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.top h1{font-size:20px;margin:0;font-weight:500}
.ib{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%}
.lbl{font-size:12.5px;color:var(--muted)}
/* inicio */
.hdc{text-align:center;line-height:1.25}
.hdc b{display:block;font-weight:500;font-size:16px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 12px}
.sech h2{margin:0;font-size:27px;font-weight:500;letter-spacing:-.01em}
.lnk{padding:4px 0;color:var(--muted);font-size:15px}
.search{display:flex;align-items:center;gap:10px;margin:4px 0 14px;padding:0 16px;border-radius:99px;background:var(--card);color:var(--muted);overflow:hidden;max-height:0;opacity:0;transition:max-height .3s,opacity .2s,margin .3s}
.search.on{max-height:60px;opacity:1}
.search svg{width:20px;height:20px}
.search input{flex:1;border:none;outline:none;background:transparent;padding:12px 0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 10px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--card);border-radius:99px;padding:8px 15px 8px 10px;font-size:14.5px;display:flex;align-items:center;gap:7px}
.chips button .em{font-size:17px;line-height:1}
.chips button sup{font-size:10.5px;color:var(--or);font-weight:600;margin-left:-2px}
.chips button.on{background:var(--ink);color:#fff}
.chips button.on sup{color:#ffd4c7}
.chips.tipo button{background:transparent;border:1px solid var(--line);padding:6px 13px;font-size:13px}
.chips.tipo button.on{background:var(--ink);border-color:var(--ink)}
.chips.ed{margin:0;padding:0;flex-wrap:wrap}
.chips.ed button{border:1px solid var(--line)}
.banner{position:relative;display:flex;align-items:stretch;width:100%;height:118px;margin:6px 0 18px;padding:0;border-radius:24px;overflow:hidden;background:#141414;color:#fff;text-align:left}
.banner .ph{width:46%;flex:0 0 auto;overflow:hidden;background:#2a2a2a;display:grid;place-items:center;color:#777}
.banner .ph img{width:100%;height:100%;object-fit:cover;display:block;-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
.banner .tx{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 18px 0 8px;min-width:0}
.banner small{font-size:12.5px;color:#a9a9a4}
.banner b{font-size:20px;font-weight:400;line-height:1.2;margin:2px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.banner .ot{font-size:12.5px;color:#a9a9a4;padding:0;text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:24px;padding:12px 12px 14px;text-align:left;min-width:0}
.gc .hv{position:absolute;left:10px;top:10px;width:34px;height:34px;z-index:1;color:var(--ink)}
.gc .hv svg{width:20px;height:20px}
.gc .hv.on{color:var(--or)}.gc .hv.on svg{fill:currentColor}
.gc .ph{aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:#b8b7b2;margin-top:30px}
.gc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gc .ph svg{width:34px;height:34px}
.gc b{font-weight:400;font-size:16px;margin-top:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gc .mt{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.gc .mt span:first-child{color:var(--ink);font-weight:500}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 10px}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;padding:0;z-index:5;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
.fab svg{width:26px;height:26px}
/* ver receta: foto a todo el ancho con el título encima y hoja blanca */
.hero{position:relative;margin:calc(-12px - env(safe-area-inset-top)) -20px 0;aspect-ratio:4/3;background:#2a2a2a;overflow:hidden;color:#fff}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .nofoto{width:100%;height:100%;display:grid;place-items:center;color:#666}
.hero .nofoto svg{width:54px;height:54px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 45%,rgba(0,0,0,.65));pointer-events:none}
.hero .fl{position:absolute;top:calc(12px + env(safe-area-inset-top));z-index:2;display:flex;gap:8px}
.hero .l{left:16px}.hero .r{right:16px}
.hero .ib{border:1px solid rgba(255,255,255,.55);color:#fff;width:42px;height:42px}
.hero .ib svg{width:20px;height:20px}
.hero .ib.on svg{fill:#fff}
.hero .ttl{position:absolute;left:20px;right:20px;bottom:44px;z-index:2}
.hero .ttl small{font-size:12.5px;opacity:.85}
.hero .ttl h1{margin:2px 0 0;font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.01em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tags span{background:#eaf6d9;color:#4f7a1f;border-radius:99px;padding:3px 11px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hoja{position:relative;z-index:3;background:var(--card);border-radius:28px 28px 0 0;margin:-28px -20px 0;padding:22px 20px 10px;min-height:50vh}
.info{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.info div{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.info div+div{border-left:1px solid var(--line)}
.info small{color:var(--muted);font-size:12.5px}
.info b{font-size:19px;font-weight:500}
h3{font-size:19px;font-weight:500;margin:26px 0 8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:none}
.ing .pt{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:0 0 auto;transform:translateY(-2px)}
.steps{margin:0;padding:0;list-style:none;counter-reset:p}
.steps li{counter-increment:p;display:flex;gap:14px;padding:10px 0}
.steps li::before{content:counter(p,decimal-leading-zero);flex:0 0 26px;color:var(--muted);font-size:14px;padding-top:2px}
.nota{background:var(--soft);border-radius:16px;padding:12px 14px;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);border-radius:99px;font-size:14px}
.cook,.save{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(calc(100% - 40px),520px);background:var(--ink);color:#fff;padding:16px;border-radius:99px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;z-index:5}
/* editor y ajustes */
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);outline:none}
.in:focus{border-color:var(--ink)}
textarea.in{resize:vertical;min-height:120px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phed{margin-top:8px;aspect-ratio:4/3;border-radius:20px;border:1.5px dashed #d6d5d0;background:var(--card);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--muted);cursor:pointer}
.phed img{width:100%;height:100%;object-fit:cover}
.phed .q{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink)}
.del{color:var(--or);margin-top:24px;padding:8px 0}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px}
.card h2{margin:0 0 6px;font-size:18px;font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--ink);color:#fff;border-radius:99px;padding:9px 16px}
.btn2{border:1px solid var(--line);border-radius:99px;padding:9px 16px}
.pill{display:inline-block;background:#4f7a1f;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;vertical-align:3px;margin-left:6px}
.pill.err{background:var(--or)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* modo cocina: fondo pastel por paso, serif fina, todo con mucho aire */
.cm{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--cr);color:var(--vd);padding:calc(14px + env(safe-area-inset-top)) 32px calc(22px + env(safe-area-inset-bottom));font-family:var(--serif);transition:background .45s}
.cm .top{min-height:40px}
.cm .top button{font-family:var(--serif);font-size:16px;padding:6px 0;color:var(--vd)}
.cm .num{margin-top:12vh;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.cm .ttl{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .paso{flex:1;min-height:0;overflow:hidden;margin:26px 0 14px;padding-right:4%;font-weight:400;line-height:1.28;text-align:left;overflow-wrap:break-word}
.cm .paso b{font-style:italic;font-weight:400;color:var(--vc)}
.cm .tim{align-self:flex-start;display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:10px 18px;border:1px solid currentColor;border-radius:99px;font-family:var(--serif);font-size:16px;color:var(--vd)}
.cm .tim svg{width:18px;height:18px}
.cm .tim.ya{opacity:.4}
.cm .pie{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.cm .vl{display:flex;align-items:flex-end;gap:14px}
.cm .vbar{position:relative;width:1px;height:64px}
.cm .vbar::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.22}
.cm .vbar i{position:absolute;left:-1px;width:3px;height:12px;background:var(--vd);opacity:1}
.cm .pie button{font-family:var(--serif);font-size:19px;padding:14px 0 6px 14px;color:var(--vd)}
.cm .pie .ant{opacity:.55}
.dock{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.dock:empty{display:none}
.tmr{position:relative;display:flex;align-items:stretch;background:rgba(28,28,27,.88);color:#fff;border-radius:99px;overflow:hidden;font-family:"Outfit",sans-serif}
.tmr .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.14);transition:width .5s linear}
.tmr .tb{position:relative;flex:1;display:flex;align-items:center;gap:12px;padding:8px 6px 8px 18px;text-align:left;border-radius:0}
.tmr .nm{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.tmr .tt{font-size:22px;font-variant-numeric:tabular-nums}
.tmr .st{font-size:12px;opacity:.65;margin-left:auto}
.tmr .tx{position:relative;width:48px;padding:0;display:grid;place-items:center;color:inherit;opacity:.8;border-radius:0}
.tmr .tx svg{width:18px;height:18px}
.tmr.pau .tt{opacity:.5}
.tmr.fin{background:var(--or)}.tmr.fin .bar{display:none}
.tmr.fin{animation:bl .6s infinite alternate}
@keyframes bl{to{opacity:.65}}
.dockf{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));width:min(calc(100% - 24px),536px);z-index:9}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:12;display:flex;align-items:flex-end}
.sheet .in2{background:var(--card);color:var(--ink);width:100%;max-height:75vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 22px calc(24px + env(safe-area-inset-bottom))}

/* ===== blanco y negro elegante: Jost light + Cormorant light, detalles en bold ===== */
:root{--bg:#f1efea;--card:#ffffff;--soft:#efefee;--ink:#111;--muted:#8e8e8a;--line:#e8e8e6;--serif:"Cormorant Garamond",Georgia,serif}
body{font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:300}
b,strong{font-weight:600}
.hdc b{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.01em}
.sech h2{font-family:var(--serif);font-weight:300;font-size:38px;line-height:1.05;letter-spacing:-.01em}
.sech h2 em{font-style:italic}
.lead{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.lnk{font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.chips button{background:var(--soft);font-weight:400;font-size:14px;padding:9px 16px}
.chips button .em{font-size:13px}
.chips button.on{background:var(--ink);color:#fff;font-weight:600}
.chips button sup{color:var(--muted)}
.chips button.on sup{color:#bbb}
.chips.tipo button{background:transparent;border-color:#dcdcd9;font-weight:300}
.search{background:var(--soft)}
/* sugerencia: tarjeta blanca con foto redonda que sobresale */
.banner{width:calc(100% - 34px);height:auto;min-height:150px;background:var(--card);color:var(--ink);overflow:visible;margin:28px 0 22px 34px;border-radius:0 80px 80px 0;padding:18px 18px 18px 0;align-items:center;box-shadow:0 18px 40px -28px rgba(0,0,0,.35)}
.banner .ph{width:142px;height:142px;flex:0 0 142px;margin:-24px 4px -24px -46px;border-radius:50%;background:var(--soft);box-shadow:0 16px 30px -14px rgba(0,0,0,.45);color:#bbb}
.banner .ph img{-webkit-mask-image:none;mask-image:none;border-radius:50%}
.banner .tx{padding:0 6px}
.banner small{color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.banner b{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.05;margin:4px 0 2px}
.banner .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner strong{font-size:17px;margin-top:6px}
.mas{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.mas svg{width:16px;height:16px;stroke-width:2}
/* tarjetas en dos columnas con foto circular */
.grid{gap:14px;row-gap:22px}
.gc{align-items:center;text-align:center;background:var(--card);border-radius:90px 90px 28px 28px;padding:14px 12px 18px;margin-top:4px}
.gc .hv{left:auto;right:6px;top:6px}
.gc .ph{width:78%;aspect-ratio:1;border-radius:50%;margin-top:0;box-shadow:0 14px 26px -14px rgba(0,0,0,.45)}
.gc b{font-family:var(--serif);font-weight:500;font-size:20px;margin-top:12px;line-height:1.1}
.gc .sub{font-size:12px;color:var(--muted);margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc strong{font-size:14.5px;margin-top:6px}
.gc .mas{margin-top:10px}
.fab{background:var(--ink)}
/* receta: plato redondo al centro */
.plato{width:min(76vw,340px);aspect-ratio:1;margin:8px auto 22px;border-radius:50%;overflow:hidden;background:var(--soft);box-shadow:0 30px 50px -26px rgba(0,0,0,.5)}
.plato img{width:100%;height:100%;object-fit:cover;display:block}
.plato .nofoto{width:100%;height:100%;display:grid;place-items:center;color:#bbb}
.plato .nofoto svg{width:56px;height:56px}
.hv.on{color:var(--ink)}.hv.on svg{fill:currentColor}
.kick{font-size:12px;font-weight:600;letter-spacing:.04em}
.rt{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.05;margin:2px 0 8px;letter-spacing:-.01em}
.desc{font-size:14.5px;color:#5c5c58;margin:0 0 14px;line-height:1.55}
.info{border:none;border-radius:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:12px}
.info div{padding:12px 4px;gap:4px}
.info div+div{border-left:1px solid var(--line);padding-left:14px}
.info small{font-size:12px}
.info b{font-size:17px}
h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:28px 0 6px}
.ing .pt{width:5px;height:5px;background:var(--ink)}
.steps li::before{font-weight:600;color:var(--ink);font-size:13px}
.cook,.save{background:var(--ink);font-weight:400;letter-spacing:.02em}
.acts button{background:var(--card);border-color:var(--line)}
.in,.card,.phed{background:var(--card)}
/* modo cocina: serif light, blanco / gris / negro */
.cm .paso{font-weight:300;line-height:1.2}
.cm .paso b{font-weight:500;font-style:italic;color:var(--vc)}
.cm .num{font-family:"Jost",sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.22em;opacity:.9}
.cm .ttl{font-family:"Jost",sans-serif;font-weight:300;font-size:11.5px}
.cm .top button,.cm .pie button,.cm .tim{font-family:"Jost",sans-serif;font-weight:300;font-size:15px}
.cm .pie .sig{font-weight:600}
.tmr{background:#111;font-family:"Jost",sans-serif}
.tmr .tt{font-weight:300}

/* ===== minimalista: fotos grandes, título encima, pocos elementos ===== */
:root{--bg:#f1efea;--card:#fff;--soft:#ececea;--ink:#121212;--muted:#9a9a96;--line:#ebebe8}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:300}
b,strong{font-weight:700}
.cir{background:var(--card);box-shadow:0 6px 18px -10px rgba(0,0,0,.25)}
.cir svg{width:20px;height:20px}
.big{font-size:34px;line-height:1.12;font-weight:300;letter-spacing:-.02em;margin:22px 0 18px}
.big b{font-weight:700}
.search{background:var(--card)}
.filtros{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;padding:0 20px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:0 0 auto;padding:7px 12px;border-radius:99px;font-size:14px;color:var(--muted);font-weight:400}
.filtros button.on{background:var(--ink);color:#fff;font-weight:600}
.filtros .div{flex:0 0 1px;height:18px;background:#d8d8d4;margin:0 8px}
.tjs{display:flex;flex-direction:column;gap:14px}
.tj{position:relative;display:block;width:100%;aspect-ratio:16/10;padding:0;border-radius:30px;overflow:hidden;background:#2b2b2a;color:#fff;text-align:left}
.tj img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tj::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.08) 55%,rgba(0,0,0,0));pointer-events:none}
.tj.sinfoto{background:linear-gradient(135deg,#3a3a38,#1c1c1b)}

  try {
    await ghSubirFotos(c);
    const payload = {app:"misrecetas", v:1, recetas, guardadoEn:tsLocal()};
    const put = sha => ghApi(c, "recetas.json", "PUT", {message:"Recetas actualizadas " + new Date().toLocaleString("es-CO"), content:b64enc(new TextEncoder().encode(JSON.stringify(payload, null, 1))), sha:sha || undefined});
    let res; try { res = await put(c.sha); } catch(e){ if (e.status === 409 || e.status === 422){ const rem = await ghLeer(c); res = await put(rem && rem.sha); } else throw e; }
    c.sha = res.content.sha; c.ultima = new Date().toISOString(); c.pendiente = false; ghSet(c); ghEstado = "";
  } catch(e){ c.pendiente = true; ghSet(c); ghEstado = ghError(e); }
  finally { ghOcupado = false; if (ruta().ajustes) render(); }
}
async function ghBajar(silencioso){
  const c = ghCfg(); if (!c || !c.token || ghOcupado || !navigator.onLine) return false;
  ghOcupado = true;
  try {
    const rem = await ghLeer(c);
    if (!rem){ ghOcupado = false; await ghSubir(); return false; }
    c.sha = rem.sha; ghSet(c);
    const remTs = rem.data.guardadoEn || "", locTs = tsLocal();
    if (Array.isArray(rem.data.recetas) && (!recetas.length || (remTs > locTs && !c.pendiente))){
      aplicandoRemoto = true;
      const ids = new Set(rem.data.recetas.map(x => x.id));
      for (const x of recetas) if (!ids.has(x.id)) await dbDel(x.id);
      for (const x of rem.data.recetas) await dbPut(x);
      aplicandoRemoto = false;
      recetas = normalizar(await dbAll());
      try { localStorage.setItem(K_TS, remTs || new Date().toISOString()); } catch(e){}
      const st = subidas(); recetas.forEach(x => { if (x.foto) st.add(x.foto); }); guardarSubidas(st);
      c.ultima = new Date().toISOString(); ghSet(c); ghEstado = "";
      if (!silencioso) toast("Recetas actualizadas desde GitHub");
      ghOcupado = false; const r = ruta(); if (!r.editar && !r.nueva && !r.cocinar) render(); return true;
    }
    ghOcupado = false;
    if (c.pendiente || locTs > remTs) await ghSubir();
    return false;
  } catch(e){ aplicandoRemoto = false; ghEstado = ghError(e); ghOcupado = false; return false; }
}
window.addEventListener("online", () => { const c = ghCfg(); if (c && c.pendiente) ghSubir(); });
document.addEventListener("visibilitychange", () => { const r = ruta(); if (!document.hidden && !r.editar && !r.nueva && !r.cocinar) ghBajar(true); });

// ---------- inicio ----------
const normalizar = arr => arr.map(x => { const r = Object.assign({titulo:"", foto:null, tiempo:"", porciones:"", ingredientes:[], pasos:[], notas:"", fav:false, cats:[], tipos:[]}, x);
  r.ingredientes = r.ingredientes.map(limpiar).filter(Boolean); r.pasos = r.pasos.map(limpiar).filter(Boolean); return r; });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  try { recetas = normalizar(await dbAll()); } catch(e){ recetas = []; toast("No se pudo abrir el almacenamiento"); }
  if (ruta().nueva) location.hash = "";
  render();
  const c = ghCfg(); if (c && c.token) ghBajar(true);
})();
})();
